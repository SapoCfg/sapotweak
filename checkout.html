<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SapoTweak - Piani</title>
  <script>
    const params = new URLSearchParams(window.location.search);
    const plan = params.get('plan');
    const next = plan === 'monthly' || plan === 'quarterly'
      ? `index.html?plan=${encodeURIComponent(plan)}#plans`
      : 'index.html#plans';
    window.location.replace(next);
  </script>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Inter, Arial, sans-serif;
      background: #0b0917;
      color: #f5f1ff;
    }
    .card {
      width: min(560px, calc(100% - 32px));
      padding: 28px;
      border-radius: 24px;
      background: rgba(22, 20, 40, 0.94);
      border: 1px solid rgba(255,255,255,.08);
      text-align: center;
      box-shadow: 0 24px 80px rgba(0,0,0,.28);
    }
    a {
      color: #cbbdff;
      font-weight: 800;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Reindirizzamento in corso</h1>
    <p>La scelta del piano e i termini completi sono disponibili direttamente nella pagina principale.</p>
    <p><a href="index.html#plans">Apri i piani</a></p>
  </div>
</body>
</html>
